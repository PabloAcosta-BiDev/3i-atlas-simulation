<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>3I-ATLAS - Visualización 3D (Modern)</title>
    <style>
        html, body { 
            margin: 0; 
            height: 100%;
            background: #000; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block; 
        }
        #ui { 
            position: absolute; 
            top: 16px; 
            left: 16px; 
            color: white; 
            font-family: Arial, sans-serif;
            background: rgba(0,0,0,0.7);
            padding: 12px;
            border-radius: 8px;
        }
        button {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
        }
        button:hover {
            background: #3a3a3a;
        }
        label {
            margin-left: 12px;
        }
        #status {
            margin-top: 8px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
    <!-- Import maps para módulos ES -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <button id="play">▶ Play</button>
        <button id="pause">⏸ Pause</button>
        <label>Velocidad: <input id="speed" type="range" min="0.1" max="10" step="0.1" value="1"></label>
        <div id="status">Cargando datos...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuración
        const API_BASE = 'http://127.0.0.1:8000';
        const VECTORS_ENDPOINT = `${API_BASE}/api/vectors`;
        const PLANETS_ENDPOINT = `${API_BASE}/api/planets`;
        const AU_TO_KM = 149597870.7; // km
        const VISUAL_SCALE = 1.0; // Escala 1:1 para ver mejor
        
        // Colores de los planetas
        const PLANET_COLORS = {
            mercury: 0xA5A5A5,  // Gris plateado
            venus: 0xE6C829,    // Amarillo dorado
            earth: 0x3366FF,    // Azul
            mars: 0xCC3300,     // Rojo
            jupiter: 0xE6B88A,  // Beige/marrón claro
            saturn: 0xEAD6B8,   // Beige dorado
            uranus: 0x73B9FF,   // Azul claro
            neptune: 0x3333CC   // Azul oscuro
        };

        // Setup Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000010);

        const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 1e6);
        
        // MODIFICADO: Definir Z como eje vertical (Z-up system)
        camera.up.set(0, 0, 1);
        
        // MODIFICADO: Posición inicial con Z como altura
        camera.position.set(0, 8, 15);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // MODIFICADO: Configuración para sistema Z-up
        controls.target.set(0, 0, 0);
        controls.update();

        // Iluminación
        const light = new THREE.DirectionalLight(0xffffff, 1.0);
        light.position.set(5,10,7.5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x333333));

        // Sol (origen)
        const sunMat = new THREE.MeshBasicMaterial({ 
            color: 0xffdd66,
            transparent: true,
            opacity: 0.8
        });
        const sunGeom = new THREE.SphereGeometry(0.1, 32, 32);
        const sun = new THREE.Mesh(sunGeom, sunMat);
        scene.add(sun);

        // MODIFICADO: Grilla en plano XY (rotada 90° para Z-up)
        const gridHelper = new THREE.GridHelper(40, 40, 0x444444, 0x222222);
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);

        // Planetas
        const planetMeshes = {};
        const planetOrbitLines = {};
        for (const [name, color] of Object.entries(PLANET_COLORS)) {
            const mat = new THREE.MeshStandardMaterial({ 
                color: color,
                metalness: 0.3,
                roughness: 0.7
            });
            const size = name === 'jupiter' ? 0.08 : 
                        name === 'saturn' ? 0.07 :
                        name === 'uranus' || name === 'neptune' ? 0.06 :
                        0.04;
            const geom = new THREE.SphereGeometry(size, 16, 16);
            const mesh = new THREE.Mesh(geom, mat);
            scene.add(mesh);
            planetMeshes[name] = mesh;
        }

        // 3I/ATLAS
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0x66aaff,
            metalness: 0.3,
            roughness: 0.7
        });
        const bodyGeom = new THREE.SphereGeometry(0.05, 16, 16);
        const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
        scene.add(bodyMesh);

        // Trail (órbita)
        let trailGeom = new THREE.BufferGeometry();
        let trailPoints = [];
        let trailLine = null;

        // Estado para animación
        let positions = [];
        let planetData = {};
        let idx = 0;
        let playing = false;
        let speed = 1.0;

        // UI
        const statusDiv = document.getElementById('status');
        document.getElementById('play').onclick = () => { playing = true; };
        document.getElementById('pause').onclick = () => { playing = false; };
        document.getElementById('speed').oninput = (e) => { 
            speed = parseFloat(e.target.value);
            statusDiv.textContent = `Velocidad: ${speed}x`;
        };

        // Calcular plano orbital desde datos reales
        function calculateOrbitalPlane(planetPositions) {
            if (planetPositions.length < 3) {
                return { normal: new THREE.Vector3(0, 1, 0), center: new THREE.Vector3(0, 0, 0) };
            }

            const center = new THREE.Vector3(0, 0, 0);
            planetPositions.forEach(p => {
                center.x += p.x;
                center.y += p.y;
                center.z += p.z;
            });
            center.divideScalar(planetPositions.length);

            const idx1 = 0;
            const idx2 = Math.floor(planetPositions.length / 2);
            const idx3 = planetPositions.length - 1;

            const p1 = new THREE.Vector3(
                planetPositions[idx1].x - center.x,
                planetPositions[idx1].y - center.y,
                planetPositions[idx1].z - center.z
            );
            const p2 = new THREE.Vector3(
                planetPositions[idx2].x - center.x,
                planetPositions[idx2].y - center.y,
                planetPositions[idx2].z - center.z
            );

            const normal = new THREE.Vector3();
            normal.crossVectors(p1, p2).normalize();

            return { normal, center };
        }

        // Función para crear órbita circular en plano inclinado
        function createPlanetOrbit(name, planetPositions, avgRadius, color) {
            const { normal, center } = calculateOrbitalPlane(planetPositions);

            const curve = new THREE.EllipseCurve(
                0, 0,
                avgRadius, avgRadius,
                0, 2 * Math.PI,
                false, 0
            );
            
            const points = curve.getPoints(100);
            const basePoints = points.map(p => new THREE.Vector3(p.x, 0, p.y));
            const baseNormal = new THREE.Vector3(0, 1, 0);
            
            const quaternion = new THREE.Quaternion();
            quaternion.setFromUnitVectors(baseNormal, normal);

            const rotatedPoints = basePoints.map(p => {
                const rotated = p.clone();
                rotated.applyQuaternion(quaternion);
                rotated.multiplyScalar(VISUAL_SCALE);
                return rotated;
            });

            const orbitGeometry = new THREE.BufferGeometry().setFromPoints(rotatedPoints);
            
            const orbitMaterial = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.3
            });
            
            const orbitLine = new THREE.Line(orbitGeometry, orbitMaterial);
            scene.add(orbitLine);
            
            console.log(`${name}: normal orbital = (${normal.x.toFixed(3)}, ${normal.y.toFixed(3)}, ${normal.z.toFixed(3)})`);
            
            return orbitLine;
        }

        // Fetch datos y setup
        async function init() {
            try {
                statusDiv.textContent = 'Cargando datos...';
                
                const res = await fetch(VECTORS_ENDPOINT);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                const planetsRes = await fetch(PLANETS_ENDPOINT);
                if (!planetsRes.ok) throw new Error('HTTP ' + planetsRes.status);
                planetData = await planetsRes.json();

                console.log('Primeros 3 registros de la API:', data.slice(0, 3));

                positions = data.map(rec => {
                    const x = parseFloat(rec.X);
                    const y = parseFloat(rec.Y);
                    const z = parseFloat(rec.Z);
                    
                    if (positions.length < 3) {
                        console.log('Posición procesada:', { x, y, z });
                        console.log('Posición escalada:', { 
                            x: x * VISUAL_SCALE, 
                            y: y * VISUAL_SCALE, 
                            z: z * VISUAL_SCALE 
                        });
                    }

                    return { 
                        x, y, z,
                        jd: rec.JD_TT || rec.JD || rec.ISO || null,
                        dist: rec.Distance_AU || Math.sqrt(x*x + y*y + z*z)
                    };
                });

                if (positions.length === 0) {
                    statusDiv.textContent = 'Error: No hay datos de posición';
                    return;
                }

                if (planetData.bodies) {
                    for (const [name, planetPositions] of Object.entries(planetData.bodies)) {
                        if (planetPositions.length > 0 && PLANET_COLORS[name]) {
                            const avgRadius = planetPositions.reduce((sum, p) => sum + p.r_au, 0) / planetPositions.length;
                            planetOrbitLines[name] = createPlanetOrbit(name, planetPositions, avgRadius, PLANET_COLORS[name]);
                            console.log(`Órbita creada para ${name}: radio = ${avgRadius.toFixed(3)} AU`);
                        }
                    }
                }

                trailPoints = new Float32Array(positions.length * 3);
                trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPoints, 3));
                
                const trailMat = new THREE.LineBasicMaterial({ 
                    color: 0x66ff88,
                    transparent: true,
                    opacity: 0.6
                });
                trailLine = new THREE.Line(trailGeom, trailMat);
                scene.add(trailLine);

                setBodyPosition(0);
                camera.lookAt(0,0,0);
                
                statusDiv.textContent = `${positions.length} puntos cargados`;
            } catch (err) {
                console.error('Error cargando vectores:', err);
                statusDiv.textContent = `Error: ${err.message}`;
            }
        }

        function setBodyPosition(i) {
            const p = positions[i];
            const sx = p.x * VISUAL_SCALE;
            const sy = p.y * VISUAL_SCALE;
            const sz = p.z * VISUAL_SCALE;
            bodyMesh.position.set(sx, sy, sz);

            if (planetData.bodies) {
                for (const [name, planetPositions] of Object.entries(planetData.bodies)) {
                    if (planetMeshes[name] && planetPositions.length > 0) {
                        const planetIdx = Math.min(
                            Math.floor((i / positions.length) * planetPositions.length),
                            planetPositions.length - 1
                        );
                        
                        const pos = planetPositions[planetIdx];
                        planetMeshes[name].position.set(
                            pos.x * VISUAL_SCALE,
                            pos.y * VISUAL_SCALE,
                            pos.z * VISUAL_SCALE
                        );
                    }
                }
            }

            for (let k = 0; k <= i; k++) {
                const q = positions[k];
                trailPoints[3*k + 0] = q.x * VISUAL_SCALE;
                trailPoints[3*k + 1] = q.y * VISUAL_SCALE;
                trailPoints[3*k + 2] = q.z * VISUAL_SCALE;
            }
            trailGeom.attributes.position.needsUpdate = true;
            trailGeom.setDrawRange(0, i+1);

            if (p.jd) {
                statusDiv.textContent = `JD: ${p.jd.toFixed(2)} | Dist: ${p.dist.toFixed(3)} AU`;
            }
        }

        // Loop de animación
        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = (now - lastTime) / 1000.0;
            lastTime = now;

            if (playing && positions.length > 1) {
                idx += speed * dt;
                if (idx >= positions.length) idx = 0;
                const i = Math.floor(idx);
                setBodyPosition(i);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth/innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // Inicio
        init().then(() => {
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
