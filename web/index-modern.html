<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>3I-ATLAS - Visualización 3D (Modern)</title>
    <style>
        html, body { 
            margin: 0; 
            height: 100%;
            background: #000; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block; 
        }
        #ui { 
            position: absolute; 
            top: 16px; 
            left: 16px; 
            color: white; 
            font-family: Arial, sans-serif;
            background: rgba(0,0,0,0.7);
            padding: 12px;
            border-radius: 8px;
        }
        button {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
        }
        button:hover {
            background: #3a3a3a;
        }
        label {
            margin-left: 12px;
        }
        #status {
            margin-top: 8px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
    <!-- Import maps para módulos ES -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <button id="play">▶ Play</button>
        <button id="pause">⏸ Pause</button>
        <label>Velocidad: <input id="speed" type="range" min="0.1" max="10" step="0.1" value="1"></label>
        <div id="status">Cargando datos...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuración
        const API_BASE = 'http://127.0.0.1:8000';
        const VECTORS_ENDPOINT = `${API_BASE}/api/vectors`;
        const PLANETS_ENDPOINT = `${API_BASE}/api/planets`;
        const AU_TO_KM = 149597870.7; // km
        const VISUAL_SCALE = 1.0; // Escala 1:1 para ver mejor
        
        // Colores de los planetas
        const PLANET_COLORS = {
            mercury: 0xA5A5A5,  // Gris plateado
            venus: 0xE6C829,    // Amarillo dorado
            earth: 0x3366FF,    // Azul
            mars: 0xCC3300,     // Rojo
            jupiter: 0xE6B88A,  // Beige/marrón claro
            saturn: 0xEAD6B8,   // Beige dorado
            uranus: 0x73B9FF,   // Azul claro
            neptune: 0x3333CC   // Azul oscuro
        };

        // Setup Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000010);

        const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 1e6);
        camera.position.set(0, 2, 3); // Más cerca para ver mejor

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Iluminación
        const light = new THREE.DirectionalLight(0xffffff, 1.0);
        light.position.set(5,10,7.5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x333333));

        // Sol (origen)
        const sunMat = new THREE.MeshBasicMaterial({ 
            color: 0xffdd66,
            transparent: true,
            opacity: 0.8
        });
        const sunGeom = new THREE.SphereGeometry(0.1, 32, 32); // Sol más pequeño
        const sun = new THREE.Mesh(sunGeom, sunMat);
        scene.add(sun);

        // Grilla de referencia (opcional)
        const gridHelper = new THREE.GridHelper(4, 4, 0x444444, 0x222222); // Grid más pequeña
        scene.add(gridHelper);

        // Planetas
        const planetMeshes = {};
        for (const [name, color] of Object.entries(PLANET_COLORS)) {
            const mat = new THREE.MeshStandardMaterial({ 
                color: color,
                metalness: 0.3,
                roughness: 0.7
            });
            // Tamaños relativos aproximados (no a escala real para que sean visibles)
            const size = name === 'jupiter' ? 0.08 : 
                        name === 'saturn' ? 0.07 :
                        name === 'uranus' || name === 'neptune' ? 0.06 :
                        0.04;  // terrestres
            const geom = new THREE.SphereGeometry(size, 16, 16);
            const mesh = new THREE.Mesh(geom, mat);
            scene.add(mesh);
            planetMeshes[name] = mesh;
        }

        // 3I/ATLAS
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0x66aaff,
            metalness: 0.3,
            roughness: 0.7
        });
        const bodyGeom = new THREE.SphereGeometry(0.05, 16, 16); // Cometa más pequeño pero visible
        const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
        scene.add(bodyMesh);

        // Trail (órbita)
        let trailGeom = new THREE.BufferGeometry();
        let trailPoints = [];
        let trailLine = null;

        // Estado para animación
        let positions = [];
        let planetData = {};
        let idx = 0;
        let playing = false;
        let speed = 1.0;

        // UI
        const statusDiv = document.getElementById('status');
        document.getElementById('play').onclick = () => { playing = true; };
        document.getElementById('pause').onclick = () => { playing = false; };
        document.getElementById('speed').oninput = (e) => { 
            speed = parseFloat(e.target.value);
            statusDiv.textContent = `Velocidad: ${speed}x`;
        };

        // Fetch datos y setup
        async function init() {
            try {
                statusDiv.textContent = 'Cargando datos...';
                
                // Cargar datos del cometa
                const res = await fetch(VECTORS_ENDPOINT);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                // Cargar datos de planetas
                const planetsRes = await fetch(PLANETS_ENDPOINT);
                if (!planetsRes.ok) throw new Error('HTTP ' + planetsRes.status);
                planetData = await planetsRes.json();

                // Log primeros 3 registros de datos crudos
                console.log('Primeros 3 registros de la API:', data.slice(0, 3));

                positions = data.map(rec => {
                    const x = parseFloat(rec.X);
                    const y = parseFloat(rec.Y);
                    const z = parseFloat(rec.Z);
                    
                    // Log las primeras 3 posiciones procesadas
                    if (positions.length < 3) {
                        console.log('Posición procesada:', { x, y, z });
                        console.log('Posición escalada:', { 
                            x: x * VISUAL_SCALE, 
                            y: y * VISUAL_SCALE, 
                            z: z * VISUAL_SCALE 
                        });
                    }

                    return { 
                        x, y, z,
                        jd: rec.JD_TT || rec.JD || rec.ISO || null,
                        dist: rec.Distance_AU || Math.sqrt(x*x + y*y + z*z)
                    };
                });

                if (positions.length === 0) {
                    statusDiv.textContent = 'Error: No hay datos de posición';
                    return;
                }

                // Trail con BufferGeometry para mejor rendimiento
                trailPoints = new Float32Array(positions.length * 3);
                trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPoints, 3));
                
                const trailMat = new THREE.LineBasicMaterial({ 
                    color: 0x66ff88,
                    transparent: true,
                    opacity: 0.6
                });
                trailLine = new THREE.Line(trailGeom, trailMat);
                scene.add(trailLine);

                // Posición inicial
                setBodyPosition(0);
                camera.lookAt(0,0,0);
                
                statusDiv.textContent = `${positions.length} puntos cargados`;
            } catch (err) {
                console.error('Error cargando vectores:', err);
                statusDiv.textContent = `Error: ${err.message}`;
            }
        }

        function setBodyPosition(i) {
            // Actualizar cometa
            const p = positions[i];
            const sx = p.x * VISUAL_SCALE;
            const sy = p.y * VISUAL_SCALE;
            const sz = p.z * VISUAL_SCALE;
            bodyMesh.position.set(sx, sy, sz);

            // Actualizar planetas (si hay datos)
            if (planetData.bodies) {
                for (const [name, positions] of Object.entries(planetData.bodies)) {
                    if (positions[0] && planetMeshes[name]) {  // Usar primera posición por ahora
                        const pos = positions[0];
                        planetMeshes[name].position.set(
                            pos.x * VISUAL_SCALE,
                            pos.y * VISUAL_SCALE,
                            pos.z * VISUAL_SCALE
                        );
                    }
                }
            }

            // Actualiza trail hasta índice actual
            for (let k = 0; k <= i; k++) {
                const q = positions[k];
                trailPoints[3*k + 0] = q.x * VISUAL_SCALE;
                trailPoints[3*k + 1] = q.y * VISUAL_SCALE;
                trailPoints[3*k + 2] = q.z * VISUAL_SCALE;
            }
            trailGeom.attributes.position.needsUpdate = true;
            trailGeom.setDrawRange(0, i+1);

            if (p.jd) {
                statusDiv.textContent = `JD: ${p.jd.toFixed(2)} | Dist: ${p.dist.toFixed(3)} AU`;
            }
        }

        // Loop de animación
        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = (now - lastTime) / 1000.0;
            lastTime = now;

            if (playing && positions.length > 1) {
                idx += speed * dt;
                if (idx >= positions.length) idx = 0;
                const i = Math.floor(idx);
                setBodyPosition(i);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth/innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // Inicio
        init().then(() => {
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
