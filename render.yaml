services:
  - type: web
    name: 3i-atlas-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        scope: PUBLIC
      - key: RENDER_URL
        scope: PUBLIC
